<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>1944 전선 사령부</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="command-panel" aria-label="작전 현황">
        <div>
          <p class="eyebrow">World War II Tactical Command</p>
          <h1>1944 전선 사령부</h1>
        </div>

        <div class="status-grid">
          <div>
            <span>작전일</span>
            <strong id="turnLabel">1</strong>
          </div>
          <div>
            <span>주도권</span>
            <strong id="phaseLabel">연합군</strong>
          </div>
          <div>
            <span>보급품</span>
            <strong id="resourceLabel">8</strong>
          </div>
          <div>
            <span>다음 보급</span>
            <strong id="baseLabel">0</strong>
          </div>
        </div>

        <div class="unit-card" id="selectedCard">
          <span class="muted">부대를 선택하세요</span>
        </div>

        <div class="actions">
          <div id="actionHint" class="action-hint">부대를 클릭하면 가능한 기능이 표시됩니다.</div>
          <button id="recruitInfantry" type="button">소총분대 증원 <span>3</span></button>
          <button id="recruitArmor" type="button">중형전차 투입 <span>5</span></button>
          <button id="recruitSpArtillery" type="button">자주포 투입 <span>300</span></button>
          <button id="recruitEngineer" type="button">공병대 투입 <span>4</span></button>
          <button id="recruitBattalionHQ" type="button">대대 사령부 투입 <span>6</span></button>
          <button id="buildBridge" type="button">다리 건설 <span>1일</span></button>
          <button id="buildDepot" type="button">보급창고 건설 <span>3일</span></button>
          <button id="buildRail" type="button">철도 부설 <span>2일</span></button>
          <button id="toggleTow" type="button">트럭 견인</button>
          <button id="endTurn" type="button" class="primary">작전 종료</button>
          <button id="restart" type="button">새 작전</button>
        </div>

        <div class="commander-list" id="commanderList"></div>
        <div class="log" id="battleLog" aria-live="polite"></div>
      </section>

      <section class="battlefield-wrap" aria-label="전장">
        <div class="legend">
          <span><i class="chip player"></i>연합군</span>
          <span><i class="chip enemy"></i>추축군</span>
          <span><i class="terrain forest"></i>삼림</span>
          <span><i class="terrain hill"></i>고지/산등성이</span>
          <span><i class="terrain base"></i>보급 거점</span>
        </div>
        <div id="battlefield" class="battlefield"></div>
      </section>

      <aside class="balance-editor" aria-label="게임 수치 에디터">
        <details open>
          <summary>게임 수치 에디터</summary>
          <div id="balanceEditor"></div>
        </details>
      </aside>
    </main>

    <script src="game.js"></script>
  </body>
</html>
