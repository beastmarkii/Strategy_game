<!-- 강변/접근로 표식. 하천(mark-water.svg)과 반드시 달라 보여야 한다 —
     하나는 "못 건넌다", 하나는 "건널 수 있는 물가"라서 뜻이 정반대다.
     그래서 색과 모양을 둘 다 갈라 놓았다: 하천은 푸른 물결선, 여기는 모래빛 자갈점.
     선을 쓰지 않는 이유는, 선을 그으면 강줄기로 잘못 읽히기 때문이다.
     이동 비용과 방어는 개활지와 같으므로(terrain.C = terrain.P) 진하게 칠하지 않는다.
     "여기는 물가다"까지만 말하고, 있지도 않은 방어 이득을 암시하지 않는다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- 젖은 모래밭. 굵은 자갈과 잔모래를 섞어야 평평한 점무늬가 아니라 물가로 읽힌다. -->
  <g fill="#8f7a46" opacity="0.5">
    <circle cx="11" cy="14" r="1.7"/>
    <circle cx="24" cy="9" r="1.4"/>
    <circle cx="37" cy="15" r="1.8"/>
    <circle cx="17" cy="24" r="1.5"/>
    <circle cx="31" cy="26" r="1.7"/>
    <circle cx="10" cy="34" r="1.4"/>
    <circle cx="24" cy="38" r="1.8"/>
    <circle cx="39" cy="35" r="1.5"/>
  </g>
  <g fill="#8f7a46" opacity="0.32">
    <circle cx="18" cy="16" r="0.9"/>
    <circle cx="31" cy="17" r="0.8"/>
    <circle cx="10" cy="24" r="0.9"/>
    <circle cx="24" cy="22" r="0.8"/>
    <circle cx="39" cy="24" r="0.9"/>
    <circle cx="17" cy="33" r="0.8"/>
    <circle cx="32" cy="34" r="0.9"/>
  </g>
</svg>
