<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1600">
  <!-- 1944년 노르망디 작전지도.
       종이 색(paper 그라디언트), 선 굵기, 투명도, 테두리는 예전 그림 그대로다.
       바뀐 것은 세 가지뿐이다.
       1) 바다를 아래에서 위로 옮겼다. 노르망디는 북쪽이 영불해협이라 해안선이
          판 위쪽에 있어야 방향 감각이 맞는다. 곡선 자체는 예전 것을 y축으로
          뒤집기만 했다 — 그리는 맛은 하나도 안 바뀐다.
       2) 바다에만 아주 옅은 찬 기운을 넣었다. 예전에는 바다와 뭍이 똑같은
          미색이라 해안선이 어디인지 알 수 없었다.
       3) 지명과 국기. 예전에는 현대 우크라이나 지도(RUSSIA·UKRAINE·KYIV)에
          현대 국기 두 개가 얹혀 있었다. 1944년 이야기와 맞지 않아 노르망디
          지명으로 바꾸고, 국기 자리에는 방위 표시를 넣었다. -->
  <defs>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e6d37a"/>
      <stop offset="0.22" stop-color="#efe7bb"/>
      <stop offset="0.55" stop-color="#e9e5ce"/>
      <stop offset="1" stop-color="#d9c267"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f251b" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="2000" height="1600" fill="url(#paper)"/>

  <!-- 영불해협. 예전 해안선 곡선을 위아래로 뒤집은 것이다. -->
  <path d="M-120 208 C230 278 480 260 765 174 C1035 93 1264 146 1550 240 C1725 298 1886 288 2110 202 L2110 -120 L-120 -120 Z" fill="#e3ece9" opacity="0.82"/>
  <path d="M-120 208 C230 278 480 260 765 174 C1035 93 1264 146 1550 240 C1725 298 1886 288 2110 202" fill="none" stroke="#829c9c" stroke-width="6" opacity="0.62"/>

  <!-- 큰 강. 여태 이 강은 기슭 두 줄만 긋고 사이를 비워 뒀다. 그래서 강이 아니라
       종이에 그은 줄 두 개로 보였다 — 세상에 속이 빈 강은 없다. 두 기슭을 하나의
       닫힌 면으로 이어 물빛을 채운다. 위쪽 기슭 곡선은 예전 그대로 두고, 아래쪽
       기슭은 그 곡선을 90 아래로 내려 그린 것으로 바꿨다. 예전 두 줄은 사이가 180쯤
       벌어져 있어서, 채우고 나니 강이 아니라 바다가 하나 더 생긴 것처럼 보였다.
       판 밖(-40, 2070)까지 늘리는 이유는 강이 지도 가장자리에서 저 혼자 끊긴 것처럼
       보이지 않게 하려는 것이다. 강은 지도 밖에서도 흐른다. -->
  <path d="M-40 630 C120 585 260 610 418 560 C585 508 664 384 824 370 C1014 354 1124 492 1280 520 C1464 553 1635 472 2070 470
           L2070 558 C1635 560 1464 641 1280 608 C1124 580 1014 442 824 458 C664 472 585 596 418 648 C260 698 120 673 -40 718 Z"
        fill="#bcd4da" opacity="0.72"/>
  <path d="M-40 630 C120 585 260 610 418 560 C585 508 664 384 824 370 C1014 354 1124 492 1280 520 C1464 553 1635 472 2070 470" fill="none" stroke="#6d8b92" stroke-width="5" opacity="0.6"/>
  <path d="M-40 718 C120 673 260 698 418 648 C585 596 664 472 824 458 C1014 442 1124 580 1280 608 C1464 641 1635 560 2070 558" fill="none" stroke="#6d8b92" stroke-width="5" opacity="0.5"/>
  <path d="M-60 1250 C190 1200 382 1226 574 1272 C785 1324 960 1375 1164 1310 C1392 1238 1596 1180 2070 1244" fill="none" stroke="#b6a779" stroke-width="4" opacity="0.32"/>

  <!-- 작은 강. 한 줄로 흐르는 강은 면을 만들 수 없으니 대신 굵기로 채운다.
       같은 곡선을 굵고 어두운 것부터 가늘고 밝은 것 순으로 세 번 겹쳐 긋는다.
       바깥이 기슭 그늘, 가운데가 물, 한복판이 하늘을 비추는 물빛이 되어
       선 하나가 저절로 강의 단면이 된다. 게임이 칠하는 물줄기와 같은 방식이다.
       굵은 겹일수록 조금씩 일찍 끊는다(pathLength 100에 dasharray). 상류로 갈수록
       강은 가늘어져야 한다 — 안 그러면 물줄기가 들판 한복판에서 굵은 채로 뭉툭하게
       끝나 버려서, 강이 아니라 누가 붓을 놓고 간 자국처럼 보인다. -->
  <g fill="none" stroke-linecap="round" pathLength="100">
    <path d="M350 185 C446 256 418 330 516 382 C628 441 718 418 790 500 C858 577 835 682 930 752 C1010 810 1128 795 1195 880" pathLength="100" stroke-dasharray="80 100" stroke="#4d6d78" stroke-width="16" opacity="0.28"/>
    <path d="M350 185 C446 256 418 330 516 382 C628 441 718 418 790 500 C858 577 835 682 930 752 C1010 810 1128 795 1195 880" pathLength="100" stroke-dasharray="90 100" stroke="#7ea6b1" stroke-width="11" opacity="0.5"/>
    <path d="M350 185 C446 256 418 330 516 382 C628 441 718 418 790 500 C858 577 835 682 930 752 C1010 810 1128 795 1195 880" pathLength="100" stroke-dasharray="97 100" stroke="#d3e6ea" stroke-width="4" opacity="0.42"/>

    <path d="M1410 185 C1374 310 1436 396 1376 512 C1305 648 1140 686 1105 824 C1072 954 1170 1075 1114 1212" pathLength="100" stroke-dasharray="80 100" stroke="#4d6d78" stroke-width="13" opacity="0.24"/>
    <path d="M1410 185 C1374 310 1436 396 1376 512 C1305 648 1140 686 1105 824 C1072 954 1170 1075 1114 1212" pathLength="100" stroke-dasharray="90 100" stroke="#7ea6b1" stroke-width="9" opacity="0.44"/>
    <path d="M1410 185 C1374 310 1436 396 1376 512 C1305 648 1140 686 1105 824 C1072 954 1170 1075 1114 1212" pathLength="100" stroke-dasharray="97 100" stroke="#d3e6ea" stroke-width="3" opacity="0.38"/>
  </g>

  <g fill="none" stroke="#9b8b5f" stroke-width="3" opacity="0.34">
    <path d="M220 930 C396 862 544 850 694 876 C842 902 952 970 1100 952 C1240 936 1368 850 1540 850"/>
    <path d="M474 1180 C630 1118 800 1128 948 1186 C1084 1240 1228 1244 1398 1190"/>
    <path d="M774 300 C910 414 1042 480 1196 505 C1370 532 1538 520 1710 548"/>
  </g>

  <!-- 지명은 여기 박아 두지 않는다. 판이 노르망디 하나였을 때는 그래도 됐지만,
       이제 이 그림은 사막에도 초원에도 깔린다. 이름은 작전이 들고 오고(scenarios.js)
       화면을 그릴 때 이 위에 얹는다(game.js renderMapLabels). 아래 점들은 그 이름이
       앉을 자리다 — 위치는 그대로 두고 부르는 이름만 바뀐다. -->

  <g fill="#21323b" opacity="0.78">
    <circle cx="620" cy="1032" r="8"/>
    <circle cx="216" cy="1064" r="7"/>
    <circle cx="440" cy="916" r="7"/>
    <circle cx="1270" cy="852" r="7"/>
    <circle cx="1490" cy="984" r="7"/>
    <circle cx="1628" cy="1152" r="7"/>
    <circle cx="1762" cy="1344" r="7"/>
  </g>

  <!-- 방위 표시. 예전 국기 두 개가 있던 자리다. -->
  <g filter="url(#softShadow)" opacity="0.4" fill="#21323b" transform="translate(-1080 1120)">
    <path d="M1806 196 l30 96 l-30 -22 l-30 22 z"/>
    <rect x="1802" y="292" width="8" height="70" rx="3"/>
    <text x="1806" y="168" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">N</text>
  </g>

  <rect x="0" y="0" width="2000" height="1600" fill="none" stroke="#d7bf65" stroke-width="18" opacity="0.28"/>
</svg>
